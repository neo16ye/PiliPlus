name: Android mini player emulator test

on:
  push:
    branches:
      - feat/android-in-app-mini-player

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Build debug APK
        run: flutter build apk --debug --android-project-arg dev=1 --no-pub

      - name: Exercise repeated mini player cycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p test-output
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d 'bilibili://video/170001' com.example.piliplus.debug
            sleep 30
            adb exec-out screencap -p > test-output/video-initial.png

            adb shell input keyevent 4
            sleep 4
            adb exec-out screencap -p > test-output/cycle-1-mini.png
            adb shell uiautomator dump /sdcard/cycle-1.xml || true
            adb pull /sdcard/cycle-1.xml test-output/cycle-1.xml || true
            grep -o 'content-desc="应用内小窗[^"]*"' test-output/cycle-1.xml || true

            adb shell input tap 760 1960
            sleep 8
            adb exec-out screencap -p > test-output/cycle-1-restored.png

            adb shell input keyevent 4
            sleep 4
            adb exec-out screencap -p > test-output/cycle-2-mini.png
            adb shell uiautomator dump /sdcard/cycle-2.xml || true
            adb pull /sdcard/cycle-2.xml test-output/cycle-2.xml || true
            grep -o 'content-desc="应用内小窗[^"]*"' test-output/cycle-2.xml || true

            adb logcat -d -v time '*:E' > test-output/logcat-errors.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fix2-emulator-evidence-api34
          path: test-output/
