name: Android mini player emulator test
# Regression gate for the fix2-based next-frame activation change.

on:
  push:
    branches:
      - feat/android-in-app-mini-player

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Apply project patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Analyze changed Dart code
        run: flutter analyze --no-pub lib/pages/video/view.dart lib/services/mini_player_service.dart lib/common/widgets/app_mini_player.dart

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

      - name: Exercise three repeated mini-player cycles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: TEST_PACKAGE=com.example.piliplus.dev TEST_APK=build/app/outputs/flutter-apk/app-x86_64-release.apk python3 .github/scripts/android_mini_player_check.py

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mini-player-three-cycle-evidence
          path: test-output/

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-fix2-mini-player-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
